<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | 스마트 플라스크 할일 관리</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-background">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="logo-icon">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div class="brand-text">
                    <h1>TaskFlow <span>Flask</span></h1>
                    <p>스마트하고 직관적인 할일 관리 스마트 앱</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="date-badge" id="current-date-badge">
                    <i class="fa-regular fa-calendar"></i> <span id="today-date">2026.09.17</span>
                </div>
                <button class="btn btn-primary btn-glow" onclick="openAddModal()">
                    <i class="fa-solid fa-plus"></i> 새 할일 추가
                </button>
            </div>
        </header>

        <!-- Stats Dashboard -->
        <section class="stats-grid">
            <div class="stat-card glass-card">
                <div class="stat-icon icon-total">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">전체 할일</span>
                    <h3 id="stat-total">0</h3>
                </div>
            </div>
            <div class="stat-card glass-card">
                <div class="stat-icon icon-completed">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">완료한 작업</span>
                    <h3 id="stat-completed">0</h3>
                </div>
            </div>
            <div class="stat-card glass-card">
                <div class="stat-icon icon-urgent">
                    <i class="fa-solid fa-fire"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">긴급 / 높은 우선순위</span>
                    <h3 id="stat-urgent">0</h3>
                </div>
            </div>
            <div class="stat-card glass-card stat-progress">
                <div class="stat-info width-full">
                    <div class="progress-header">
                        <span class="stat-label">목표 달성률</span>
                        <span class="progress-percent" id="stat-percent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Controls Toolbar -->
        <section class="toolbar glass-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="검색할 업무 제목 또는 내용을 입력하세요..." oninput="debounceSearch()">
                <button class="clear-search-btn" id="clear-search-btn" onclick="clearSearch()" style="display:none;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="filter-controls">
                <!-- Status Filter Tabs -->
                <div class="status-tabs">
                    <button class="tab-btn active" data-status="" onclick="setStatusFilter('', this)">전체</button>
                    <button class="tab-btn" data-status="active" onclick="setStatusFilter('active', this)">진행 중</button>
                    <button class="tab-btn" data-status="completed" onclick="setStatusFilter('completed', this)">완료됨</button>
                </div>

                <!-- Select Filters -->
                <div class="select-group">
                    <div class="custom-select-wrapper">
                        <i class="fa-solid fa-folder select-icon"></i>
                        <select id="category-filter" onchange="applyFilters()">
                            <option value="">모든 카테고리</option>
                            <option value="Work">💼 업무 (Work)</option>
                            <option value="Personal">🏡 개인 (Personal)</option>
                            <option value="Shopping">🛒 쇼핑 (Shopping)</option>
                            <option value="Health">💪 건강 (Health)</option>
                            <option value="Study">📚 학습 (Study)</option>
                            <option value="Other">📌 기타 (Other)</option>
                        </select>
                    </div>

                    <div class="custom-select-wrapper">
                        <i class="fa-solid fa-flag select-icon"></i>
                        <select id="priority-filter" onchange="applyFilters()">
                            <option value="">모든 우선순위</option>
                            <option value="High">🔴 높은 우선순위</option>
                            <option value="Medium">🟡 보통</option>
                            <option value="Low">🟢 낮음</option>
                        </select>
                    </div>
                </div>

                <button class="btn btn-outline-danger" onclick="clearCompleted()" title="완료된 목록 일괄 삭제">
                    <i class="fa-solid fa-trash-can"></i> 완료 항목 삭제
                </button>
            </div>
        </section>

        <!-- Todo Items Container -->
        <main class="todo-section">
            <div id="todo-list" class="todo-list">
                <!-- Dynamic Items Inserted via JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state glass-card" style="display: none;">
                <div class="empty-icon">
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <h3>등록된 할일이 없습니다</h3>
                <p>새로운 목표와 할일을 등록하여 효율적으로 일정을 관리해 보세요!</p>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="fa-solid fa-plus"></i> 첫 할일 작성하기
                </button>
            </div>
        </main>
    </div>

    <!-- Modal Form (Add / Edit) -->
    <div class="modal-overlay" id="todo-modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2 id="modal-title"><i class="fa-solid fa-pen-to-square"></i> 새 할일 등록</h2>
                <button class="close-modal" onclick="closeModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="todo-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="todo-id" value="">
                
                <div class="form-group">
                    <label for="form-title">제목 <span class="required">*</span></label>
                    <input type="text" id="form-title" placeholder="무엇을 해야 하나요?" required maxlength="100">
                </div>

                <div class="form-group">
                    <label for="form-description">상세 설명</label>
                    <textarea id="form-description" rows="3" placeholder="필요한 추가 정보나 메모를 입력하세요..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="form-category">카테고리</label>
                        <select id="form-category">
                            <option value="Work">💼 업무 (Work)</option>
                            <option value="Personal">🏡 개인 (Personal)</option>
                            <option value="Shopping">🛒 쇼핑 (Shopping)</option>
                            <option value="Health">💪 건강 (Health)</option>
                            <option value="Study">📚 학습 (Study)</option>
                            <option value="Other">📌 기타 (Other)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="form-priority">우선순위</label>
                        <select id="form-priority">
                            <option value="High">🔴 높은 (High)</option>
                            <option value="Medium" selected>🟡 보통 (Medium)</option>
                            <option value="Low">🟢 낮음 (Low)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="form-duedate">마감 기한</label>
                    <input type="date" id="form-duedate">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">
                        <i class="fa-solid fa-check"></i> 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
